name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: memshare
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: memshare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memshare -d memshare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MEMSHARE_TEST_DATABASE_URL: postgresql://memshare:test-password@127.0.0.1:5432/memshare_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: cargo build --release --locked
      - run: cargo package --locked

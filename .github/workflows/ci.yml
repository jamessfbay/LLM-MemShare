name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66 # 1.89.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo install cargo-audit --locked --version 0.22.2
      # rsa is only present in Cargo.lock through sqlx-macros/sqlx-mysql and is absent
      # from the compiled PostgreSQL-only graph (`cargo tree -i rsa` is empty).
      - run: if cargo tree -i rsa 2>/dev/null | grep -q '^rsa '; then exit 1; fi
      - run: cargo audit --ignore RUSTSEC-2023-0071
      - run: cargo build --release --locked
      - run: cargo package --locked

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: memshare
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: memshare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memshare -d memshare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MEMSHARE_TEST_DATABASE_URL: postgresql://memshare:test-password@127.0.0.1:5432/memshare_test
      MEMSHARE_TEST_HOST: 127.0.0.1
      MEMSHARE_TEST_PORT: 5432
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66 # 1.89.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install cargo-llvm-cov --locked --version 0.9.1
      - run: cargo llvm-cov --all-targets --all-features --fail-under-lines 50 --lcov --output-path lcov.info
      - run: bash scripts/verify-multi-process.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: lcov.info
          if-no-files-found: error

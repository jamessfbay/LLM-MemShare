[package]
name = "llm-memshare"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Multi-tenant memory and handoff middleware for agents"
repository = "https://github.com/jamessfbay/LLM-MemShare"
homepage = "https://github.com/jamessfbay/LLM-MemShare"
documentation = "https://docs.rs/llm-memshare"
readme = "README.md"
keywords = ["agents", "llm", "memory", "multi-tenant", "middleware"]
categories = ["database", "web-programming::http-server"]
exclude = [
  ".gstack/**",
  ".pytest_cache/**",
  ".venv/**",
  "**/__pycache__/**",
  "**/*.pyc",
  "src/llm_memshare.egg-info/**",
]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
